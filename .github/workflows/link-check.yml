name: Verificacion de enlaces

on:
  schedule:
    - cron: "0 9 * * 1"
  push:
    paths:
      - "**.md"
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar enlaces de los archivos markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,206,429
            --exclude-mail
            "**/*.md"
          fail: true
