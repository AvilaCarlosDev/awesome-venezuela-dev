name: Verificacion de enlaces

on:
  schedule:
    - cron: "0 9 * * 1"
  push:
    paths:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache de lychee
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Revisar enlaces de los archivos markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          # Causa raiz de los fallos previos: github.com responde 429/503 a las
          # peticiones anonimas que salen de los runners de Actions. Con el token
          # lychee valida esos enlaces por la API y deja de dar falsos positivos.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --max-retries 3
            --retry-wait-time 5
            --accept 200,206,429
            "**/*.md"
          fail: true
